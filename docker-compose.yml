version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: qchain-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - ANVIL_RPC_URL=http://anvil:8545
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./samples:/app/samples:ro
      - ./backend/reports:/app/backend/reports
    depends_on:
      - anvil
    restart: unless-stopped

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: qchain-anvil
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--block-time", "1"]
    ports:
      - "8545:8545"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qchain-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/events
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: qchain-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
